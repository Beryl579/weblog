/* ---------- BACKEND LAYER (GAS / Local / Dummy) ---------- */
var BACKEND = (typeof google !== 'undefined' && google.script && google.script.run) ? 'gas' : 'local';
var LS_KEY = 'ddk_progress_';

function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY+(user?user.nis:''))||'null'); }catch(e){ return null; } }
function lsSave(p){ try{ localStorage.setItem(LS_KEY+(user?user.nis:''), JSON.stringify(p)); }catch(e){} }
function emptyProgress(){
  return { kuis:{kuis1:null,kuis2:null,kuis3:null,kuis4:null}, ujian:null };
}
function normalizeProgress(p){
  var e = emptyProgress();
  if(!p) return e;
  ['kuis1','kuis2','kuis3','kuis4'].forEach(function(k){ if(p.kuis && p.kuis[k]) e.kuis[k]=p.kuis[k]; });
  if(p.ujian) e.ujian = p.ujian;
  return e;
}
function apiCall(fnName, payload, cb){
  if(BACKEND==='gas'){
    google.script.run.withSuccessHandler(cb).withFailureHandler(function(){ cb(null); })[fnName](payload);
  } else {
    fetch('/api/'+fnName, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .then(function(r){return r.json()}).then(cb).catch(function(){ cb(null); });
  }
}
function loadProgress(cb){
  if(!user){ cb(emptyProgress()); return; }
  apiCall('getStudentProgress', {userId:user.id, nis:user.nis}, function(res){
    if(res && res.success && res.progress){ progress = normalizeProgress(res.progress); }
    else { progress = lsLoad() || emptyProgress(); }
    lsSave(progress);
    cb(progress);
  });
}
function saveQuizResult(quizKey, score, total, cb){
  var nilai = Math.round(score/total*100);
  var rec = {best:nilai, passed:nilai>=PASS_SCORE, score:score, total:total, at:new Date().toISOString()};
  // optimistic local
  if(quizKey==='ujian') progress.ujian = rec;
  else progress.kuis[quizKey] = rec;
  lsSave(progress);
  apiCall('submitMateriQuiz', {userId:user.id, nis:user.nis, quizKey:quizKey, score:score, total:total}, function(res){
    if(res && res.success && res.progress){ progress = normalizeProgress(res.progress); lsSave(progress); }
    cb(progress);
  });
}

/* ---------- GATING ---------- */
function quizPassed(key){
  var node = (key==='ujian') ? progress.ujian : progress.kuis[key];
  return !!(node && node.passed);
}
function isMateriUnlocked(num){
  if(num===1) return true;
  return quizPassed('kuis'+(num-1));
}
function isUjianUnlocked(){
  return quizPassed('kuis4');
}
function bestScore(key){
  var node = (key==='ujian') ? progress.ujian : progress.kuis[key];
  return node ? node.best : null;
}

/* ---------- ROUTER ---------- */
var routes = { dashboard:renderDashboard, materi:renderMateriList, materidetail:renderMateriDetail, kuis:renderKuis, ujian:renderUjian };
function route(){
  var h = (location.hash||'#/dashboard').replace('#/','');
  var parts = h.split('/');
  var page = parts[0]||'dashboard';
  var arg = parts[1]?decodeURIComponent(parts[1]):null;
  document.getElementById('sidebar').classList.remove('open');
  (routes[page]||renderDashboard)(arg);
  highlightNav(page, arg);
  window.scrollTo(0,0);
}
function go(path){
  // Kalau hash-nya sama, hashchange tidak terpicu -> panggil route() langsung.
  if(location.hash === path || location.hash === '#'+path){ route(); return; }
  location.hash = path;
}
function highlightNav(page, arg){
  document.querySelectorAll('.sidebar-nav a').forEach(function(a){
    var r = a.getAttribute('data-r');
    a.classList.toggle('active', r===page && (!arg || a.getAttribute('data-arg')===String(arg)));
  });
}

/* ---------- RENDER: SIDEBAR ---------- */
function renderNav(){
  var nav = document.getElementById('navMateri');
  nav.innerHTML = '';
  MATERI.forEach(function(m){
    var unlocked = isMateriUnlocked(m.num);
    var done = quizPassed('kuis'+m.num);
    var a = document.createElement('a');
    a.href = unlocked ? ('#/materidetail/'+m.num) : '#';
    a.setAttribute('data-r','materidetail');
    a.setAttribute('data-arg', String(m.num));
    a.style.opacity = unlocked?1:0.55;
    a.innerHTML = '<span class="icon">'+(done?'✅':(unlocked?m.num:'🔒'))+'</span> '+m.num+' · '+m.judul.split(' ').slice(0,2).join(' ')+'...';
    if(!unlocked) a.onclick = function(e){ e.preventDefault(); showToast('Selesaikan kuis Materi '+(m.num-1)+' dulu (nilai ≥ '+PASS_SCORE+')','error'); };
    nav.appendChild(a);
  });
  var navU = document.getElementById('navUjian');
  navU.innerHTML='';
  var unlocked = isUjianUnlocked();
  var done = quizPassed('ujian');
  var a = document.createElement('a');
  a.href = unlocked ? '#/ujian' : '#';
  a.setAttribute('data-r','ujian');
  a.style.opacity = unlocked?1:0.55;
  a.innerHTML = '<span class="icon">'+(done?'🏆':(unlocked?'📝':'🔒'))+'</span> Ujian Akhir';
  if(!unlocked) a.onclick = function(e){ e.preventDefault(); showToast('Lulus kuis Materi 4 dulu untuk membuka Ujian Akhir','error'); };
  navU.appendChild(a);
}

function nextActionCta(){
  for(var i=1;i<=4;i++){
    if(!quizPassed('kuis'+i)){
      if(isMateriUnlocked(i)) return '<a class="btn-hero-primary" href="#/materidetail/'+i+'">▶ Lanjut Materi '+i+'</a>';
    }
  }
  if(!quizPassed('ujian')) return '<a class="btn-hero-primary" href="#/ujian">🏆 Kerjakan Ujian Akhir</a>';
  return '<a class="btn-hero-primary" href="#/materi">📚 Review Materi</a>';
}

function renderMateriCards(containerId){
  var c = document.getElementById(containerId);
  if(!c) return;
  c.innerHTML = '';
  MATERI.forEach(function(m){
    var unlocked = isMateriUnlocked(m.num);
    var passed = quizPassed('kuis'+m.num);
    var div = document.createElement('div');
    div.className = 'materi-card' + (passed?' done':'') + (unlocked?'':' locked');
    div.innerHTML = ''
      + (passed ? '<span class="done-tag">✓ Lulus</span>' : (unlocked?'':'<span class="lock-tag">🔒 Terkunci</span>'))
      + '<div style="display:flex;gap:10px;align-items:center"><div class="materi-num">'+m.num+'</div><h3>'+m.judul+'</h3></div>'
      + '<small style="color:var(--muted)">'+m.sections.length+' bagian · kuis '+m.kuis.length+' soal</small>'
      + (bestScore('kuis'+m.num)!==null ? '<small>Nilai kuis terbaik: <strong>'+bestScore('kuis'+m.num)+'</strong></small>' : '')
      + '<div style="margin-top:auto">'+(unlocked
          ? '<a class="btn btn-outline" href="#/materidetail/'+m.num+'" style="width:100%">'+(passed?'Baca ulang':'Buka materi')+' →</a>'
          : '<button class="btn btn-outline" style="width:100%" disabled>🔒 Selesaikan kuis materi '+(m.num-1)+'</button>')
      + '</div>';
    c.appendChild(div);
  });
}

/* ---------- KOMPONEN: PANEL DISTRIBUSI PROGRES ----------
   Metafora panel listrik DDK (busbar + MCB), bukan kartu spreadsheet. */
function panelProgres(){
  var rows = '';
  MATERI.forEach(function(m){
    var on = quizPassed('kuis'+m.num);
    var nilai = bestScore('kuis'+m.num);
    var unlocked = isMateriUnlocked(m.num);
    var state = on ? 'LULUS' : (unlocked ? 'MENUNGGU' : 'TERKUNCI');
    rows += '<div class="breaker '+(on?'on':'off')+'">'
      + '<span class="lamp"></span><span class="tag">Q'+m.num+'</span>'
      + '<span class="name">M'+m.num+' · '+m.judul.split(' ').slice(0,2).join(' ')+'</span>'
      + '<span class="val">'+(nilai===null?'—':nilai)+'</span>'
      + '<span class="state">'+state+'</span></div>';
  });
  var onU = quizPassed('ujian');
  var uNilai = bestScore('ujian');
  rows += '<div class="breaker '+(onU?'on':'off')+'">'
    + '<span class="lamp"></span><span class="tag">Q5</span>'
    + '<span class="name">Ujian Akhir</span>'
    + '<span class="val">'+(uNilai===null?'—':uNilai)+'</span>'
    + '<span class="state">'+(onU?'LULUS':(isUjianUnlocked()?'SIAP':'TERKUNCI'))+'</span></div>';

  var avg = [];
  ['kuis1','kuis2','kuis3','kuis4'].forEach(function(k){ if(progress.kuis[k]) avg.push(progress.kuis[k].best); });
  var avgNilai = avg.length ? Math.round(avg.reduce(function(a,b){return a+b;},0)/avg.length) : null;
  var semuaLulus = ['kuis1','kuis2','kuis3','kuis4','ujian'].every(function(k){ return quizPassed(k); });

  return '<div class="panel">'
    + '<div class="panel-head"><div class="panel-title"><span class="bolt">⚡</span> Panel Progres Belajar</div>'
    + '<span class="panel-tag">DDK · X TITL</span></div>'
    + '<div class="panel-body"><div class="busbar"></div>' + rows
    + '<div class="panel-foot">'
    + '<div><div class="label">Rata-rata nilai kuis</div><div class="readout">'+(avgNilai===null?'—':avgNilai)+'</div></div>'
    + '<div style="text-align:right"><div class="label">Status</div><div class="readout" style="font-size:15px">'+(semuaLulus?'LULUS 🎉':'BELAJAR')+'</div></div>'
    + '</div></div></div>';
}

/* ---------- RENDER: BLOK KAYA (paragraf, daftar, tabel, kotak, rumus) ---------- */
function renderBlocks(blocks){
  if(!blocks) return '';
  return blocks.map(function(b){
    if(!b) return '';
    if(b.t==='ul') return '<ul>'+(b.items||[]).map(function(i){ return '<li>'+i+'</li>'; }).join('')+'</ul>';
    if(b.t==='table') return '<div class="table-wrap" style="margin:10px 0"><table class="comp-table"><thead><tr>'
      + (b.head||[]).map(function(h){ return '<th>'+h+'</th>'; }).join('')
      + '</tr></thead><tbody>'
      + (b.rows||[]).map(function(r){ return '<tr>'+r.map(function(cl){ return '<td>'+cl+'</td>'; }).join('')+'</tr>'; }).join('')
      + '</tbody></table></div>';
    if(b.t==='note') return '<div class="blk-note"><strong>🔎 '+(b.title||'')+'</strong><div>'+b.text+'</div></div>';
    if(b.t==='case') return '<div class="blk-case"><strong>🧩 '+(b.title||'')+'</strong><div>'+b.text+'</div></div>';
    if(b.t==='formula') return '<div class="blk-formula">'+(b.text||'')+'</div>';
    return '<p>'+(b.text||'')+'</p>';
  }).join('');
}
function renderGlosarium(g){
  if(!g || !g.length) return '';
  return '<div class="glossary"><div class="glossary-title">📖 Glosarium Istilah</div>'
    + g.map(function(x){ return '<div class="glossary-row"><span class="glossary-term">'+x.istilah+'</span><span class="glossary-arti">'+x.arti+'</span></div>'; }).join('')
    + '</div>';
}

    return;

  var passed = quizPassed('kuis'+m.num);
  // Dukung skema baru (`blocks`) maupun lama (`p`) agar tidak ada bagian yang hilang.
  var secHtml = m.sections.map(function(s){
    var body = s.blocks ? renderBlocks(s.blocks) : '<p>'+(s.p||'')+'</p>';
    return '<h3>'+s.h+'</h3>'+body;
  }).join('');
  var html = ''
  + '<a href="#/materi" style="font-size:13px">← Semua materi</a>'

  + '<img class="materi-banner" src="'+m.img.src+'" alt="'+m.img.cap+'" loading="lazy">'
  + '<div class="materi-hero-body">'
  + '<div class="badge-pill">🎯 Tujuan Pembelajaran</div>'
  + '<p style="margin-top:10px">'+m.tujuan+'</p>'
  + '<div class="img-credit">'+m.img.credit+'</div>'
  + '</div></div>'
  + '<div class="card materi-content">'+secHtml
  + '<div class="rangkuman"><strong>📌 Rangkuman</strong><br>'+m.rangkuman+'</div>'
  + renderGlosarium(m.glosarium)
  + '</div>'
  + '<div class="card">'
  + (passed
      ? '<span class="pill pill-pass">✓ Kuis lulus — nilai '+bestScore('kuis'+m.num)+'</span> <a class="btn btn-outline" style="margin-left:8px" onclick="startQuiz(\'kuis'+m.num+'\')">Ulangi kuis (latihan)</a>'

  + '</div>';

}

var quiz = null;

// Halaman kembali: sumber kuis kalau keluar sebelum selesai.
function kuisKembali(key){ return key==='ujian' ? '/ujian' : '/materidetail/'+String(key).replace('kuis',''); }
// Halaman lanjutan setelah hasil tampil.
function kuisLanjut(key, nomor, isUjian, passed){
  if(!passed) return { href:'#'+kuisKembali(key), label:'Kembali ke materi' };
  if(isUjian) return { href:'#/dashboard', label:'Ke Dashboard' };
  if(nomor < MATERI.length) return { href:'#/materidetail/'+(nomor+1), label:'Materi '+(nomor+1)+' →' };
  return { href:'#/ujian', label:'Ujian Akhir →' };
}
// Pintu masuk dari tombol: pindah ke halaman kuis.
function startQuiz(key){ go('/kuis/'+key); }

function renderKuis(key){
  var main = document.getElementById('main');
  var isUjian = key==='ujian';
  var nomor = Number(String(key).replace('kuis',''));
  if(isUjian && !isUjianUnlocked()){
    main.innerHTML = '<div class="locked-note">🔒 Ujian Akhir terbuka setelah kamu lulus kuis Materi 4. <a href="#/dashboard">Kembali ke dashboard</a></div>';
    return;
  }
  if(!isUjian && (!MATERI[nomor-1] || !isMateriUnlocked(nomor))){
    main.innerHTML = '<div class="locked-note">🔒 Kuis ini terkunci. Lulus kuis sebelumnya dulu (nilai ≥ '+PASS_SCORE+'). <a href="#/dashboard">Kembali ke dashboard</a></div>';
    return;
  }
  var qs = isUjian ? UJIAN : MATERI[nomor-1].kuis;
  quiz = { key:key, isUjian:isUjian, nomor:nomor, qs:qs, idx:0, ans:new Array(qs.length).fill(null), done:false };
  drawKuis();
}

function drawKuis(){
  if(!quiz || quiz.done) return;
  var q = quiz.qs[quiz.idx];
  var jawab = quiz.ans.filter(function(a){ return a!==null; }).length;
  var opts = q.o.map(function(o,i){
    return '<button class="'+(quiz.ans[quiz.idx]===i?'sel':'')+'" onclick="pickOpt('+i+')">'
      + '<span class="opt-key">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span></button>';
  }).join('');
  var nav = quiz.qs.map(function(_, i){
    var cls = (i===quiz.idx) ? 'current' : (quiz.ans[i]!==null ? 'answered' : '');
    return '<button class="'+cls+'" onclick="gotoSoal('+i+')">'+(i+1)+'</button>';
  }).join('');
  document.getElementById('main').innerHTML = ''
  + '<div class="quiz-page">'
  + '<div class="quiz-top">'
  + '<a class="quiz-exit" href="#'+kuisKembali(quiz.key)+'">← Keluar</a>'
  + '<div class="quiz-top-title">'+(quiz.isUjian?'🏆 Ujian Akhir':'📝 Kuis Materi '+quiz.nomor)+'</div>'
  + '<span class="badge-pill">Soal '+(quiz.idx+1)+'/'+quiz.qs.length+'</span>'
  + '</div>'
  + '<div class="progress" style="margin:12px 0 14px"><div class="progress-bar green" style="width:'+(jawab/quiz.qs.length*100)+'%"></div></div>'
  + '<div class="card quiz-card-full">'
  + '<div class="quiz-q">'+q.q+'</div>'
  + '<div class="quiz-opts">'+opts+'</div>'
  + '<div class="why-box" id="whyBox" style="'+(quiz.ans[quiz.idx]!==null && q.why ? 'display:block' : '')+'">'+(q.why?'💡 '+q.why:'')+'</div>'
  + '</div>'
  + '<div class="card quiz-nav-wrap">'
  + '<div class="quiz-nav-title"><span>Navigasi soal</span><span class="quiz-answered-bar">'+jawab+'/'+quiz.qs.length+' terjawab</span></div>'
  + '<div class="quiz-nav">'+nav+'</div>'
  + '</div>'
  + '<div class="quiz-foot">'
  + '<button class="btn btn-outline" onclick="quizNav(-1)" '+(quiz.idx===0?'disabled':'')+'>← Sebelumnya</button>'
  + '<button class="btn-hero-primary" onclick="quizNav(1)">'+(quiz.idx===quiz.qs.length-1?'Selesai →':'Lanjut →')+'</button>'
  + '</div>'
  + '</div>';
  window.scrollTo(0,0);
}

function gotoSoal(i){
  if(!quiz || quiz.done || i<0 || i>=quiz.qs.length) return;
  quiz.idx = i;
  drawKuis();
}

function pickOpt(i){
  quiz.ans[quiz.idx] = i;
  drawKuis();
}

function quizNav(dir){
  if(dir===1 && quiz.ans[quiz.idx]===null){ showToast('Pilih salah satu jawaban dulu','error'); return; }
  var next = quiz.idx + dir;
  if(next >= quiz.qs.length) return quizResult();
  quiz.idx = (next < 0) ? 0 : next;
  drawKuis();
}

function quizResult(){
  if(!quiz) return;
  var score = 0;
  quiz.qs.forEach(function(q,i){ if(quiz.ans[i]===q.a) score++; });
  var nilai = Math.round(score/quiz.qs.length*100);
  var passed = nilai >= PASS_SCORE;
  var key = quiz.key, isUjian = quiz.isUjian, nomor = quiz.nomor;
  quiz.done = true;

  // Review soal yang belum tepat + pembahasan.
  var salah = '';
  quiz.qs.forEach(function(q,i){
    if(quiz.ans[i] !== q.a){
      salah += '<div class="quiz-review-item">'
        + '<div><b>'+(i+1)+'. '+q.q+'</b></div>'
        + '<div>Jawabanmu: '+(quiz.ans[i]===null?'—':String.fromCharCode(65+quiz.ans[i]))
        + ' · Jawaban benar: <b>'+String.fromCharCode(65+q.a)+'. '+q.o[q.a]+'</b></div>'
        + (q.why ? '<div class="quiz-review-why">💡 '+q.why+'</div>' : '')
        + '</div>';
    }
  });
  var lanjut = kuisLanjut(key, nomor, isUjian, passed);

  document.getElementById('main').innerHTML = ''
  + '<div class="quiz-page"><div class="card quiz-result">'
  + '<div style="font-size:46px">'+(passed?'🎉':'😅')+'</div>'
  + '<h2 style="margin:8px 0">Nilai kamu: '+nilai+'</h2>'
  + '<small>Benar '+score+' dari '+quiz.qs.length+' soal · KKTP '+PASS_SCORE+'</small><br><br>'
  + (passed
      ? (isUjian ? '<span class="pill pill-pass">🏆 Selamat! Ujian Akhir selesai</span>' : '<span class="pill pill-pass">Materi berikutnya terbuka!</span>')
      : '<span class="pill pill-fail">Belum lulus — pelajari lagi materinya</span>')
  + '<div style="display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap">'
  + '<button class="btn btn-outline" onclick="startQuiz(\''+key+'\')">Coba lagi</button>'
  + '<a class="btn-hero-primary" href="'+lanjut.href+'">'+lanjut.label+'</a>'
  + '</div>'
  + (salah ? '<div class="quiz-review"><h3>Review jawaban yang belum tepat</h3>'+salah+'</div>' : '')
  + '</div></div>';
  window.scrollTo(0,0);

  saveQuizResult(key, score, quiz.qs.length, function(){
    renderNav();
    if(passed){ showToast((isUjian?'Ujian':'Kuis materi '+nomor)+' lulus! Nilai: '+nilai, 'success'); }
  });
}

/* ---------- AUTH & INIT ---------- */
function doLogout(){
  var nis = user ? user.nis : null;
  var finish = function(){ localStorage.removeItem('user'); localStorage.removeItem('nis'); location.href='?page=login'; };
  if(BACKEND==='gas' && nis){ google.script.run.withSuccessHandler(finish).logout(nis); } else { finish(); }
}

function init(){
  try{ user = JSON.parse(localStorage.getItem('user')||'null'); }catch(e){ user=null; }
  if(!user || !user.nis){ location.href='?page=login'; return; }
  if(['guru','admin'].indexOf(String(user.role||'').toLowerCase())!==-1){ location.href='?page=guru'; return; }
  document.getElementById('sbUser').textContent = user.nama+' • '+user.kelas;
  loadProgress(function(){
    renderNav();
    window.addEventListener('hashchange', route);
    route();
  });
}
init();
</script>
</body>
</html>
